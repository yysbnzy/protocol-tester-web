name: Build and Release

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: v3.1.4)'
        required: true
        default: 'v3.1.4'
  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 允许上传 Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask>=3.0.0 flask-socketio>=5.5.0 flask-cors>=5.0.0 flask-limiter>=3.5.0 scapy>=2.7.0 psutil>=7.0.0 pyinstaller>=6.15.0

      - name: Build EXE
        run: python build_exe.py

      - name: Rename output
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          $src = "dist/ProtocolTester.exe"
          $dst = "dist/ProtocolTester-$version.exe"
          Copy-Item $src $dst
          Write-Host "Output: $dst"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Protocol Tester ${{ github.event.inputs.version || github.ref_name }}
          files: dist/ProtocolTester-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
